server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 1100m;

    # Re-resolve the backend through Docker's DNS: a recreated backend container gets a new address,
    # and a name resolved once at startup would leave the dashboard proxying to a dead IP (502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_request_buffering off;
        proxy_read_timeout 60s;
    }
    location = /health { proxy_pass $backend; }
    location = /ready { proxy_pass $backend; }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
