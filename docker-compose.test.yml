# Test services for the backend test suite (OQ-02). Bound to 127.0.0.1 only; separate Compose
# project (`-p mulenetx-test`) so it never mixes with the application stack.
services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mulenetx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-superuser-secret
      MULENETX_OWNER_PASSWORD: test-owner-secret
      MULENETX_APP_PASSWORD: test-app-secret
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mulenetx"]
      interval: 2s
      timeout: 3s
      retries: 30

  neo4j-test:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/test-neo4j-secret
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1:57687:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p test-neo4j-secret 'RETURN 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 40
