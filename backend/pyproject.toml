[project]
name = "mulenetx"
version = "1.0.0"
description = "MuleNetX graph-native financial-crime investigation platform (SRS v1.3.3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "neo4j>=5.20,<6",
    "networkx>=3.3,<4",
    "numpy>=1.26,<3",
    "xgboost>=2.1,<3",
    "scikit-learn>=1.5,<2",
    "shap>=0.46,<1",
    "argon2-cffi>=23.1,<26",
    "httpx>=0.27,<1",
    "python-multipart>=0.0.9,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "hypothesis>=6.112,<7",
    "jsonschema>=4.23",
]

[project.scripts]
mulenetx = "mulenetx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mulenetx"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607", "S608", "B017"]
"alembic/**" = ["S608"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mulenetx"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "shap.*", "xgboost.*", "sklearn.*", "argon2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
    "integration: needs PostgreSQL and/or Neo4j test services",
    "neo4j: needs the Neo4j test service",
    "ollama: needs a live Ollama service",
    "docker: drives the Docker Compose stack",
    "perf: benchmark harness",
    "e2e: end-to-end golden path",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
known-first-party = ["mulenetx", "tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.File", "fastapi.Form",
    "fastapi.Header", "mulenetx.api.deps.require",
]
