# MuleNetX deployment (SRS §26). Only `dashboard` and `backend` publish ports (SR-22).
name: mulenetx

x-app-env: &app-env
  POSTGRES_DSN: postgresql+psycopg://mulenetx_app:${MULENETX_APP_PASSWORD:?set in .env}@postgres:5432/mulenetx
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set in .env}
  OLLAMA_URL: http://ollama:11434
  OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b-instruct}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
  ARTIFACT_DIR: /data/artifacts
  STAGING_DIR: /data/staging
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  MULENETX_BOOTSTRAP_ADMIN_USERNAME: ${MULENETX_BOOTSTRAP_ADMIN_USERNAME:-admin}
  MULENETX_BOOTSTRAP_ADMIN_PASSWORD: ${MULENETX_BOOTSTRAP_ADMIN_PASSWORD:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mulenetx
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set in .env}
      MULENETX_OWNER_PASSWORD: ${MULENETX_OWNER_PASSWORD:?set in .env}
      MULENETX_APP_PASSWORD: ${MULENETX_APP_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mulenetx"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set in .env}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-512m}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-256m}
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30

  ollama:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.5.4}
    restart: unless-stopped
    volumes:
      - ollama_models:/root/.ollama

  ollama-pull:
    image: ollama/ollama:${OLLAMA_IMAGE_TAG:-0.5.4}
    restart: "no"
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 3; ollama pull \"${OLLAMA_MODEL:-qwen2.5:7b-instruct}\""]

  migrate:
    build: ./backend
    image: mulenetx-backend:local
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *app-env
      POSTGRES_OWNER_DSN: postgresql+psycopg://mulenetx_owner:${MULENETX_OWNER_PASSWORD:?set in .env}@postgres:5432/mulenetx
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  backend:
    image: mulenetx-backend:local
    restart: unless-stopped
    command: ["backend"]
    environment: *app-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - artifacts:/data/artifacts
      - staging:/data/staging
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: mulenetx-backend:local
    restart: unless-stopped
    command: ["worker"]
    environment: *app-env
    volumes:
      - artifacts:/data/artifacts
      - staging:/data/staging
    depends_on:
      migrate:
        condition: service_completed_successfully

  dashboard:
    build: ./frontend
    image: mulenetx-dashboard:local
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    depends_on:
      - backend

volumes:
  postgres_data:
  neo4j_data:
  ollama_models:
  artifacts:
  staging:
